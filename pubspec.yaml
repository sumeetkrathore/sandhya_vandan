name: sandhya_vandan
description: "Read, listen and follow Sandya Vandan with Samadha Ashram."
publish_to: 'none'

version: 1.1.3+2027

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  flutter_svg: ^2.0.10
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.2.8
  just_audio: ^0.10.6
  audio_service: ^0.18.12
  audio_session: ^0.1.18
  url_launcher: ^6.2.6
  http: ^1.2.0
  html_unescape: ^2.0.0
  intl: ^0.19.0
  flutter_html: ^3.0.0
  package_info_plus: ^10.2.1
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^17.2.1
  in_app_update: ^4.2.3
  timezone: ^0.9.3
  permission_handler: ^11.3.1
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.7.9
  in_app_review: ^2.0.9
  flutter_timezone: ^3.0.0
  flutter_markdown: ^0.7.3
  shimmer: ^3.0.0
  html: 0.15.4
  path_provider: ^2.1.2
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  youtube_player_iframe: ^6.0.2
  share_plus: ^13.3.0

dependency_overrides:
  html: 0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#FAF7F2"
  color_dark: "#24070D"
  android_12:
    color: "#FAF7F2"
    color_dark: "#24070D"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "dev_assets/app_icon_source_1024.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "dev_assets/app_icon_source_1024.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/amrit_vani_pilot.json
    - assets/data/audio_timeline.json
    - assets/images/
    - assets/branding/
    - dev_assets/

  fonts:
    - family: SaremAsifa
      fonts:
        - asset: assets/fonts/Sarem Asifa Bold.ttf
          weight: 700
    - family: MBSaremIqra
      fonts:
        - asset: assets/fonts/MBSaremIqra.ttf
    - family: FedraSansPro
      fonts:
        - asset: assets/fonts/FedraSansPro-Regular.ttf
        - asset: assets/fonts/FedraSansPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/FedraSansPro-Bold.ttf
          weight: 700
    - family: FedraSerifA
      fonts:
        - asset: assets/fonts/FedraSerifA-Normal.otf
        - asset: assets/fonts/FedraSerifA-Medium.otf
          weight: 500
        - asset: assets/fonts/FedraSerifA-Bold.ttf
          weight: 700

